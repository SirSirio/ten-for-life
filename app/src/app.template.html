<script>
/*@EXERCISES@*/
/*@FIGURES@*/
/*@VIDEOS@*/
const EXMAP = Object.fromEntries(EX.map(e=>[e.id,e]));
for(const e of EX){ const v=(typeof VIDEOS!=="undefined")&&VIDEOS[e.id]; if(v&&v.videoId){ e.video={id:v.videoId,title:v.title||e.name,channel:v.channel||""}; } }
// Inline players are blocked inside the claude.ai artifact viewer; they work when this same file is hosted elsewhere (e.g. GitHub Pages).
const CAN_EMBED = !(window.claude && window.claude.use) && !/claude\.ai$|claudeusercontent|anthropic/.test(location.hostname) && location.protocol!=="about:";
const CORE = ["breath_slow","catcamel","birddog","sideplank"];
const UNLOCK_ORDER = ["chin_tuck","tspine_ext","balance","doorway","sitrise","ytw","hang","posture_wall","hip9090","wall_slide","hipflexor","calfraise","glute_bridge","armswing","bdj1","facepull","zhan","splitsquat","wrist","tib","bdj2","wgs","shoulderCARs","squat_hold","owl","hollow","bdj_full","ankleCARs","band_pull","breath_sigh","yoga_flow","gmb_daily","pogo"];
const POSTURE = ["chin_tuck","tspine_ext","doorway","ytw","posture_wall","wall_slide","glute_bridge","facepull","band_pull"];
const SLOT_ORDER = {
  5:["breath","spine","core","core"],
  10:["breath","spine","core","core","posture","shoulders","hips","balance","floor","legs","mind"],
  15:["breath","spine","core","core","posture","shoulders","wrists","hips","legs","balance","floor","mind"]
};
const SLOT_NAMES = {breath:"Breath",spine:"Spine",balance:"Balance",floor:"Floor",shoulders:"Shoulders",posture:"Posture",hips:"Hips",legs:"Legs & feet",core:"Trunk",wrists:"Wrists",mind:"Standing & qigong",video:"Follow-along"};
const PACE = {slow:{sessions:7,days:7},normal:{sessions:4,days:5},fast:{sessions:2,days:2}};
const ANCHORS = [
 {id:"strength",name:"Strength session",target:2,why:"30–60 min/week of lifting is where the mortality curve bends (Momma 2022). Two sessions covers it, and it is also how you bank muscle and bone."},
 {id:"hard",name:"Hard cardio (intervals)",target:1,why:"Fitness is one of the strongest predictors of lifespan. Intervals raise VO2max more than steady work for the same time (Helgerud 2007)."},
 {id:"easy",name:"Easy movement 30+ min",target:3,why:"Walks, cycling, a sport you practise. Toward the 150 min/week floor; daily steps show a dose-response with mortality."},
 {id:"friend",name:"Time with a friend",target:1,why:"Social connection: about 50% higher survival odds in the big meta-analysis (Holt-Lunstad 2010). Observational, but the largest signal of anything here."},
 {id:"outdoors",name:"Hours outdoors",target:2,why:"120+ min/week in nature goes with better self-rated health (White 2019). Train outside and this fills itself."}
];
const BENCH = [
 {id:"ols_closed",name:"One-leg stand, eyes closed",unit:"s",hint:"Worst side, best of 2 tries, max 60"},
 {id:"hang_time",name:"Dead hang",unit:"s",hint:"One continuous hang"},
 {id:"srt",name:"Sit–rise score",unit:"/10",hint:"5 down + 5 up, −1 per support, −0.5 per wobble"},
 {id:"rhr",name:"Morning resting heart rate",unit:"bpm",hint:"Lying still, before getting up"}
];

/* ===================== State & storage ===================== */
const todayStr = (d=new Date()) => { const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); };
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const isoWeek = (d=new Date()) => { const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7); return y+"-W"+String(w).padStart(2,"0"); };

const defaultState = () => ({v:1,created:todayStr(),
  settings:{equip:{bar:true,band:true,floor:true,step:false},travel:false,pace:"normal",sound:true,pauseUnlocks:false,postureFocus:false,tier:10,postureTier:5,theme:"dark"},
  unlocked:[...CORE],offered:null,snoozed:{},lastUnlock:{date:todayStr(),sessionsAt:0},
  sessions:0,postureSessions:0,lastDone:{},counts:{},benchmarks:[],peek:false});
const defaultLog = () => ({days:{},weeks:{},posture:{}});

let state = defaultState();
let logs = {};          // year -> {days, weeks}
let db=null, uid=null, online=false;
let saving = Promise.resolve();

const LS = {
  get(k){ try{ const v=localStorage.getItem("mr:"+k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("mr:"+k,JSON.stringify(v)); }catch(e){} }
};
function mergeState(remote){ remote=clone(remote); const d=defaultState(); const ds=d.settings, de=d.settings.equip; const out=Object.assign(d,remote||{}); out.settings=Object.assign({},ds,(remote&&remote.settings)||{}); out.settings.equip=Object.assign({},de,(remote&&remote.settings&&remote.settings.equip)||{}); return out; }
function logFor(dateStr){ const y=dateStr.slice(0,4); if(!logs[y]) logs[y]=defaultLog(); if(!logs[y].posture) logs[y].posture={}; return logs[y]; }

function persist(key, val){
  LS.set(key,val);
  if(db && uid){
    saving = saving.then(()=> db.doc("data/users/"+uid+"/"+key).set(val)).catch(e=>{ console.warn("db write failed",e); setSync(false,"saved on this device only"); });
  }
  scheduleGist();
}
function scheduleGist(){ if(gistOn()){ clearTimeout(gist.timer); gist.timer=setTimeout(()=>{ gist.timer=null; gistSync(true); },1500); } }
const saveState = () => { state.updated=Date.now(); persist("state", state); };
const saveLog = (dateStr) => { const y=dateStr.slice(0,4); persist("log-"+y, logs[y]); };

function setSync(on,label){ const el=document.getElementById("sync"); el.classList.toggle("on",!!on); el.querySelector("span").textContent=label||(on?"synced":"this device"); online=!!on; }

function loadLocal(){
  const s=LS.get("state"); if(s) state=mergeState(s);
  const y=new Date().getFullYear();
  for(const yy of [y-1,y]){ const l=LS.get("log-"+yy); if(l) logs[yy]=l; }
}

async function connect(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d || !u) return;
    uid = await u.id(); if(!uid) return;
    db = d;
    const y=new Date().getFullYear();
    const refs = {state:db.doc("data/users/"+uid+"/state")};
    for(const yy of [y-1,y]) refs["log-"+yy]=db.doc("data/users/"+uid+"/log-"+yy);
    const snaps = await Promise.all(Object.values(refs).map(r=>r.get()));
    const keys = Object.keys(refs);
    let remoteState=null;
    snaps.forEach((s,i)=>{ if(s.exists){ const k=keys[i]; if(k==="state") remoteState=clone(s.data()); else logs[k.slice(4)]=mergeLog(logs[k.slice(4)], clone(s.data())); }});
    if(remoteState){
      // remote wins when it is further along (more sessions) or equal; local wins otherwise, then gets pushed up
      if((remoteState.sessions||0) >= (state.sessions||0)) state=mergeState(remoteState);
    }
    saveState(); for(const yy of Object.keys(logs)) persist("log-"+yy, logs[yy]);
    setSync(true,"synced");
    // follow changes made from another device
    refs.state.onSnapshot(s=>{ if(!s.exists||s.metadata.hasPendingWrites) return; const r=clone(s.data()); if(JSON.stringify(r)!==JSON.stringify(state)){ if((r.sessions||0)+(r.postureSessions||0) < (state.sessions||0)+(state.postureSessions||0)) return; state=mergeState(r); LS.set("state",state); render(); } }, e=>console.warn(e));
    refs["log-"+y].onSnapshot(s=>{ if(!s.exists||s.metadata.hasPendingWrites) return; const r=clone(s.data()); const merged=mergeLog(logs[y], r); if(JSON.stringify(merged)!==JSON.stringify(logs[y])){ logs[y]=merged; LS.set("log-"+y,merged); render(); } }, e=>console.warn(e));
    render();
  }catch(e){ console.warn("db unavailable",e); }
}
const clone = x => x==null ? x : JSON.parse(JSON.stringify(x)); // db snapshots are frozen; always work on a copy
// per date, the entry with more exercises done wins; on a tie, b wins
const doneScore = e => (e.done||[]).length + (e.hist||[]).reduce((n,r)=>n+(r.done||[]).length,0);
const pickDays = (a={},b={}) => { const o=Object.assign({},a); for(const k in b){ const x=o[k], y=b[k]; o[k] = (x&&y&&doneScore(x)>doneScore(y)) ? x : y; } return o; };
function mergeLog(a,b){ a=a||defaultLog(); b=b||defaultLog(); return {days:pickDays(a.days,b.days),weeks:Object.assign({},a.weeks,b.weeks),posture:pickDays(a.posture,b.posture)}; }

/* ---- Personal profile: your own texts layered over the generic library.
   It lives on your devices (and, encrypted, in the sync gist), never in the app's code, so the code can stay public.
   Shape: {v, updated, postureNote, notes:{exerciseId:text}, anchors:{anchorId:why}, exercises:{exerciseId:{why,protects,steps,pitfalls,evidence}}} ---- */
const PROFILE_FIELDS = ["why","protects","steps","pitfalls","evidence"];
const defaultProfile = () => ({v:1,updated:0,postureNote:"",notes:{},anchors:{},exercises:{}});
const EX_BASE = Object.fromEntries(EX.map(e=>[e.id,Object.fromEntries(PROFILE_FIELDS.map(k=>[k,e[k]]))]));
const ANCHOR_BASE = Object.fromEntries(ANCHORS.map(a=>[a.id,a.why]));
function cleanProfile(p){   // keep only well-formed fields, so a typo in a hand-edited file cannot break rendering
  if(!p || typeof p!=="object") throw new Error("not a profile");
  const str=v=>typeof v==="string", strs=v=>Array.isArray(v)&&v.every(str), out=defaultProfile();
  out.updated=+p.updated||0;
  if(str(p.postureNote)) out.postureNote=p.postureNote;
  for(const [id,t] of Object.entries(p.notes||{})) if(EX_BASE[id]&&str(t)&&t.trim()) out.notes[id]=t;
  for(const [id,t] of Object.entries(p.anchors||{})) if(id in ANCHOR_BASE&&str(t)) out.anchors[id]=t;
  for(const [id,o] of Object.entries(p.exercises||{})){
    if(!EX_BASE[id]||!o||typeof o!=="object") continue;
    const e={}; for(const k of PROFILE_FIELDS){ const v=o[k]; if((k==="why"||k==="evidence")?str(v):strs(v)) e[k]=v; }
    if(Object.keys(e).length) out.exercises[id]=e;
  }
  return out;
}
let profile = (()=>{ try{ return cleanProfile(LS.get("profile")||{}); }catch(e){ return defaultProfile(); } })();
function applyProfile(){
  for(const e of EX){ const o=profile.exercises[e.id]||{}; for(const k of PROFILE_FIELDS) e[k] = o[k]!=null ? o[k] : EX_BASE[e.id][k]; }
  for(const a of ANCHORS) a.why = profile.anchors[a.id] || ANCHOR_BASE[a.id];
}
function saveProfile(){ profile.updated=Date.now(); LS.set("profile",profile); applyProfile(); scheduleGist(); }
const profileCount = () => ({ex:Object.keys(profile.exercises).length, notes:Object.keys(profile.notes).length});

/* ---- End-to-end encryption for the gist: AES-GCM with a key derived from your passphrase (PBKDF2-SHA256).
   Encrypted on the device before upload, so GitHub only ever stores ciphertext. ---- */
const TE=new TextEncoder(), TD=new TextDecoder();
const b64 = u8 => { let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let gistKeys = {};   // salt -> CryptoKey, derived once per session (deriving is deliberately slow)
async function keyFor(salt){
  if(!gistKeys[salt]){
    const base=await crypto.subtle.importKey("raw",TE.encode(gist.cfg.pass),"PBKDF2",false,["deriveKey"]);
    gistKeys[salt]=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  }
  return gistKeys[salt];
}
async function seal(text){
  if(!gist.cfg.salt){ gist.cfg.salt=b64(crypto.getRandomValues(new Uint8Array(16))); LS.set("gist",gist.cfg); }
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFor(gist.cfg.salt),TE.encode(text));
  return JSON.stringify({enc:"AES-GCM/PBKDF2-SHA256",salt:gist.cfg.salt,iv:b64(iv),ct:b64(new Uint8Array(ct))});
}
async function unseal(o){
  let pt; try{ pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},await keyFor(o.salt),unb64(o.ct)); }catch(e){ throw new Error("passphrase"); }
  if(gist.cfg.salt!==o.salt){ gist.cfg.salt=o.salt; LS.set("gist",gist.cfg); }   // another device created the gist: reuse its salt
  return JSON.parse(TD.decode(pt));
}

/* ---- Sync through a private GitHub gist (standalone app only; claude.ai uses its own database above) ---- */
const GIST_FILE = "morning-reserve.json";
const gist = {cfg:LS.get("gist"), timer:null, busy:Promise.resolve()};   // cfg: {token, pass, id, salt, base}; base = state.updated at the last sync
const gistOn = () => CAN_EMBED && !!(gist.cfg && gist.cfg.token && gist.cfg.pass && gist.cfg.id);   // CAN_EMBED doubles as "not inside claude.ai"
const GH = (path,opt={}) => fetch("https://api.github.com"+path, Object.assign({cache:"no-store"},opt,{headers:{Authorization:"Bearer "+gist.cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}}))
  .then(r=>{ if(!r.ok) throw new Error("GitHub "+r.status); return r.json(); });
async function gistRead(){
  const g=await GH("/gists/"+gist.cfg.id); const f=g.files&&g.files[GIST_FILE]; if(!f) return null;
  const txt = f.truncated ? await fetch(f.raw_url,{cache:"no-store"}).then(r=>r.text()) : f.content;
  let o; try{ o=JSON.parse(txt); }catch(e){ return null; }
  return o && o.ct ? unseal(o) : o;   // a plain copy (from before encryption) is read once, then replaced by an encrypted one
}
const gistWrite = async text => GH("/gists/"+gist.cfg.id,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:await seal(text)}}})});
const snapshot = () => JSON.stringify({state,logs,profile});
function adoptState(r){   // does the gist's state replace ours?
  const base=gist.cfg.base||0, rs=r.updated||0, ls=state.updated||0;
  if(rs<=base) return false;            // gist unchanged since our last sync
  if(ls<=base) return true;             // only the gist changed
  const prog=s=>(s.sessions||0)+(s.postureSessions||0);   // both changed: further along wins, then newer
  return prog(r)!==prog(state) ? prog(r)>prog(state) : rs>ls;
}
// pull, merge, push back whatever the gist lacks. preferLocal decides same-day ties: true after a local change, false when pulling
function gistSync(preferLocal){
  if(!gistOn()) return Promise.resolve();
  return gist.busy = gist.busy.then(async ()=>{
    try{
      const remote=await gistRead()||{}, rlogs=remote.logs||{};
      const before=snapshot();
      for(const y of new Set([...Object.keys(logs),...Object.keys(rlogs)])) logs[y] = preferLocal ? mergeLog(rlogs[y],logs[y]) : mergeLog(logs[y],rlogs[y]);
      if(remote.state && adoptState(remote.state)) state=mergeState(remote.state);
      if(remote.profile && (remote.profile.updated||0) > profile.updated){ try{ profile=cleanProfile(remote.profile); applyProfile(); }catch(e){} }   // the profile: newer edit wins
      const mine=snapshot();
      if(mine!==before){ LS.set("state",state); LS.set("profile",profile); for(const y of Object.keys(logs)) LS.set("log-"+y,logs[y]); if(!run) render(); }
      if(mine!==JSON.stringify({state:remote.state,logs:remote.logs,profile:remote.profile})) await gistWrite(mine);
      gist.cfg.base=state.updated||0; LS.set("gist",gist.cfg);
      setSync(true,"synced");
    }catch(e){ console.warn("gist sync failed",e); setSync(false, e.message==="passphrase" ? "wrong passphrase" : "offline · saved here"); }
  });
}
async function gistConnect(token,pass){
  gist.cfg={token,pass}; gistKeys={};
  try{
    const found=(await GH("/gists?per_page=100")).find(g=>g.files&&g.files[GIST_FILE]);
    if(found){ gist.cfg.id=found.id; await gistRead(); }   // throws on a wrong passphrase before anything is written
    else gist.cfg.id=(await GH("/gists",{method:"POST",body:JSON.stringify({description:"@APP_NAME@ data (encrypted)",public:false,files:{[GIST_FILE]:{content:await seal(snapshot())}}})})).id;
    gist.cfg.base=0; LS.set("gist",gist.cfg);
    await gistSync(false);
    toast(found?"Connected; your data is synced":"Connected; created an encrypted gist");
  }catch(e){ gist.cfg=null; toast(e.message==="passphrase"?"That passphrase does not open your synced data":/401|403/.test(e.message)?"GitHub refused that token":"Could not reach GitHub"); }
  render();
}
function gistReplace(){   // after an import: overwrite the gist instead of merging into it
  if(!gistOn()) return;
  gist.busy = gist.busy.then(()=>gistWrite(snapshot())).then(()=>{ gist.cfg.base=state.updated||0; LS.set("gist",gist.cfg); }).catch(e=>console.warn(e));
}
document.addEventListener("visibilitychange",()=>{
  if(!gistOn()) return;
  if(document.visibilityState==="hidden"){ if(gist.timer){ clearTimeout(gist.timer); gist.timer=null; gistSync(true); } }
  else gistSync(false);

/* ===================== Planning ===================== */
function equipOK(ex){
  const eq=state.settings.equip, travel=state.settings.travel;
  return ex.equip.every(k => k==="floor" ? eq.floor : (!travel && eq[k]));
}
function available(){ return state.unlocked.filter(id=>EXMAP[id] && equipOK(EXMAP[id])); }
function secsFor(ex,tier){ return typeof ex.secs==="object" ? ex.secs[tier] : ex.secs; }
function lastDoneKey(id){ return state.lastDone[id] || "0000-00-00"; }

function buildPlan(tier, dateStr){
  const avail = available();
  const budget = tier*60;
  const plan=[]; let total=0;
  const pick = slot => {
    const c = avail.filter(id=>EXMAP[id].slot===slot && !plan.includes(id));
    if(!c.length) return null;
    c.sort((a,b)=> lastDoneKey(a).localeCompare(lastDoneKey(b)) || UNLOCK_ORDER.indexOf(a)-UNLOCK_ORDER.indexOf(b));
    return c[0];
  };
  // follow-along day: every 4th session at 10 or 15 min, once a video is unlocked
  const videos = avail.filter(id=>EXMAP[id].slot==="video");
  if(tier>=10 && videos.length && state.sessions>0 && state.sessions%4===3){
    videos.sort((a,b)=>lastDoneKey(a).localeCompare(lastDoneKey(b)));
    const b=pick("breath"); if(b){plan.push(b);}
    const c1=pick("core"); if(c1) plan.push(c1);
    plan.push(videos[0]);
    if(tier===15){ const bal=pick("balance"); if(bal) plan.push(bal); const fl=pick("floor"); if(fl) plan.push(fl); }
    return plan;
  }
  const add = slot => { const id=pick(slot); if(!id) return false; const s=secsFor(EXMAP[id],tier); if(total+s > budget+30) return false; plan.push(id); total+=s; return true; };
  const focus = state.settings.postureFocus;
  // posture focus: a posture item is guaranteed in 10 and 15 (right after the floor), and the 5-minute version gets one too
  const order = focus ? (tier===5 ? [...SLOT_ORDER[5],"posture"] : ["breath","spine","core","core","posture",...SLOT_ORDER[tier].slice(5)]) : SLOT_ORDER[tier];
  for(const slot of order) add(slot);
  // second pass: fill remaining time with a second exercise from the big slots
  const extra = tier===15 ? (focus?["posture","hips","legs","shoulders","mind","spine","core"]:["hips","legs","posture","shoulders","mind","spine","core"]) : tier===10 ? (focus?["posture","hips"]:["hips","legs"]) : [];
  for(const slot of extra){ if(total >= budget-45) break; add(slot); }
  // keep the balance and floor screens last, standing work at the very end
  const tail = plan.filter(id=>["balance","floor","mind"].includes(EXMAP[id].slot));
  const head = plan.filter(id=>!tail.includes(id));
  tail.sort((a,b)=>["balance","floor","mind"].indexOf(EXMAP[a].slot)-["balance","floor","mind"].indexOf(EXMAP[b].slot));
  return [...head,...tail];
}
function planSecs(plan,tier){ return plan.reduce((t,id)=>t+secsFor(EXMAP[id],tier),0); }

/* Posture programme: a separate 5/10-minute routine built only from the posture set, independent of unlocks. */
function buildPosturePlan(tier){
  const ok = id => EXMAP[id] && equipOK(EXMAP[id]);
  let plan = ["chin_tuck","tspine_ext","doorway"];
  if(tier===10){
    const pulls=["facepull","band_pull","wall_slide"].filter(ok).sort((a,b)=>lastDoneKey(a).localeCompare(lastDoneKey(b)));
    plan.push("ytw", pulls[0], "glute_bridge", "wall_slide");
  }
  plan.push("posture_wall");
  return [...new Set(plan.filter(id=>id&&ok(id)))];
}
function postureEntry(create){
  const d=todayStr(); const L=logFor(d);
  if(!L.posture[d] && create){ L.posture[d]={tier:state.settings.postureTier||5,plan:buildPosturePlan(state.settings.postureTier||5),done:[],skipped:[],secs:0}; saveLog(d); }
  return L.posture[d];
}
function replanPosture(tier){
  const d=todayStr(); const L=logFor(d); const e=L.posture[d]||{done:[],skipped:[],secs:0};
  e.tier=tier; e.plan=buildPosturePlan(tier); L.posture[d]=e; state.settings.postureTier=tier; saveState(); saveLog(d);
}
const curEntry = () => (run&&run.kind==="posture") ? postureEntry(true) : todayEntry(true);
function todayEntry(create){
  const d=todayStr(); const L=logFor(d);
  if(!L.days[d] && create){ L.days[d]={tier:state.settings.tier,plan:buildPlan(state.settings.tier,d),done:[],skipped:[],secs:0}; saveLog(d); }
  return L.days[d];
}
function replan(tier){
  const d=todayStr(); const L=logFor(d); const e=L.days[d]||{done:[],skipped:[],secs:0};
  e.tier=tier; e.plan=buildPlan(tier,d); L.days[d]=e; state.settings.tier=tier; saveState(); saveLog(d);
}
function swapItem(idx){
  const e=todayEntry(true); const cur=EXMAP[e.plan[idx]];
  const c=available().filter(id=>EXMAP[id].slot===cur.slot && !e.plan.includes(id));
  if(!c.length){ toast("Nothing else unlocked for "+SLOT_NAMES[cur.slot].toLowerCase()+" yet"); return; }
  c.sort((a,b)=>lastDoneKey(a).localeCompare(lastDoneKey(b)));
  e.plan[idx]=c[0]; saveLog(todayStr()); render();
}

/* ===================== Unlocks ===================== */
function nextCandidate(){
  const t=todayStr();
  for(const id of UNLOCK_ORDER){
    if(state.unlocked.includes(id)) continue;
    if(state.snoozed[id] && state.snoozed[id] > t) continue;
    if(!equipOK(EXMAP[id])) continue;
    return id;
  }
  return null;
}
function maybeOffer(){
  if(state.settings.pauseUnlocks || state.offered) return;
  const p=PACE[state.settings.pace]||PACE.normal;
  const sinceSessions = state.sessions - (state.lastUnlock.sessionsAt||0);
  const sinceDays = daysBetween(state.lastUnlock.date||state.created, todayStr());
  if(sinceSessions>=p.sessions && sinceDays>=p.days){
    const id=nextCandidate(); if(id){ state.offered={id,date:todayStr()}; saveState(); }
  }
}
function acceptOffer(){
  const id=state.offered.id; state.unlocked.push(id); state.offered=null;
  state.lastUnlock={date:todayStr(),sessionsAt:state.sessions}; saveState();
  // add it to today's plan if it fits the tier and nothing is done yet
  const e=todayEntry(true); if(!e.done.length){ e.plan=buildPlan(e.tier,todayStr()); if(!e.plan.includes(id) && EXMAP[id].slot!=="video"){ e.plan.push(id);} saveLog(todayStr()); }
  toast(EXMAP[id].name+" added to the rotation"); render();
}
function snoozeOffer(){
  const id=state.offered.id; const d=new Date(); d.setDate(d.getDate()+7);
  state.snoozed[id]=todayStr(d); state.offered=null; state.lastUnlock={date:todayStr(),sessionsAt:state.sessions}; saveState(); render();
}

/* ===================== Session runner ===================== */
let run=null; // {i, left, timer, paused, done:[], skipped:[], startedAt}
let audio=null;
function beep(n=1){ if(!state.settings.sound) return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const t=audio.currentTime; for(let k=0;k<n;k++){ const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=660; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(0.0001,t+k*0.22); g.gain.exponentialRampToValueAtTime(0.2,t+k*0.22+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+k*0.22+0.18); o.start(t+k*0.22); o.stop(t+k*0.22+0.2);} }catch(e){} }
let wakeLock=null;
async function keepAwake(){ try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }

function startSession(kind="main",manual=false){
  const e= kind==="posture" ? postureEntry(true) : todayEntry(true);
  if(!e.plan.length){ toast("Nothing in the plan for this equipment"); return; }
  if(!manual) beep(1);
  keepAwake();
  run={kind,manual,i:0,left:secsFor(EXMAP[e.plan[0]],e.tier),timer:null,paused:false,done:[],skipped:[],startedAt:Date.now()};
  if(!manual) tick();
  render();
}
function tick(){
  clearInterval(run.timer);
  run.timer=setInterval(()=>{
    if(run.paused) return;
    run.left-=1;
    const el=document.getElementById("clock"); const bar=document.getElementById("bar");
    if(el) el.textContent=fmt(run.left);
    if(bar){ const e=curEntry(); const tot=secsFor(EXMAP[e.plan[run.i]],e.tier); bar.style.width=(100*(tot-run.left)/tot)+"%"; }
    if(run.left<=0){ beep(2); advance(true); }
  },1000);
}
function advance(done){
  const e=curEntry(); const id=e.plan[run.i];
  (done?run.done:run.skipped).push(id);
  run.i+=1;
  if(run.i>=e.plan.length){ finishSession(); return; }
  run.left=secsFor(EXMAP[e.plan[run.i]],e.tier); run.more=false; render();
}
function goBack(){
  if(!run || run.i===0) return;
  const e=curEntry(); run.i-=1; const id=e.plan[run.i];
  run.done=run.done.filter(x=>x!==id); run.skipped=run.skipped.filter(x=>x!==id);
  run.left=secsFor(EXMAP[id],e.tier); run.more=false; render();
}
function finishSession(){
  clearInterval(run.timer); releaseWake();
  const e=curEntry(); const d=todayStr(); const kind=run.kind;
  e.done=[...new Set([...e.done,...run.done])]; e.skipped=run.skipped.filter(id=>!e.done.includes(id));
  e.secs=(e.secs||0)+Math.round((Date.now()-run.startedAt)/1000);
  commitDay(e,d,kind);
  run={kind,finished:true,done:e.done.length,secs:e.secs}; render();
}
function commitDay(e,d,kind="main"){
  const first = !e.counted, roundCounted = e.rc!==undefined ? e.rc : !!e.counted;
  for(const id of e.done){ state.lastDone[id]=d; }
  if(!roundCounted && e.done.length){ e.rc=true; for(const id of e.done) state.counts[id]=(state.counts[id]||0)+1; }
  // only the first session of a day moves the unlock clock; extra rounds still count per exercise
  if(first && e.done.length){ e.counted=true; if(kind==="posture") state.postureSessions=(state.postureSessions||0)+1; else state.sessions+=1; }
  saveLog(d); saveState(); if(kind==="main") maybeOffer(); saveState();
}
// "Again": file the finished round away and plan a fresh one, with free choice of length
function newRound(kind){
  const e= kind==="posture" ? postureEntry(true) : todayEntry(true);
  e.hist=[...(e.hist||[]),{tier:e.tier,plan:e.plan,done:e.done,skipped:e.skipped,secs:e.secs,feel:e.feel}];
  e.plan= kind==="posture" ? buildPosturePlan(e.tier) : buildPlan(e.tier,todayStr());
  e.done=[]; e.skipped=[]; e.secs=0; e.rc=false; delete e.feel;
  saveLog(todayStr()); render(); window.scrollTo(0,0);
}
const roundNo = e => (e.hist||[]).length + 1;
function dayStats(e){   // a whole day across rounds, for history
  if(!e) return {did:0,tier:0,secs:0};
  const rs=[...(e.hist||[]),e].filter(r=>r.done&&r.done.length);
  return {did:rs.length, tier:rs.reduce((m,r)=>Math.max(m,r.tier||0),0), secs:rs.reduce((n,r)=>n+(r.secs||0),0)};
}
function quickLog(kind="main"){
  const e= kind==="posture" ? postureEntry(true) : todayEntry(true); const d=todayStr();
  e.done=[...e.plan]; e.skipped=[]; e.secs=planSecs(e.plan,e.tier); commitDay(e,d,kind); toast("Logged"); render();
}
function cancelSession(){ clearInterval(run.timer); releaseWake(); run=null; render(); }
function setFeel(v,kind="main"){ const e= kind==="posture" ? postureEntry(true) : todayEntry(true); e.feel=v; saveLog(todayStr()); if(run&&run.finished){ run=null; toast("Saved"); } render(); }
const fmt = s => { s=Math.max(0,s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function gradeChip(g){ return `<span class="chip ${g}">${g==="strong"?"solid evidence":g==="moderate"?"moderate evidence":"thin evidence"}</span>`; }

      ? `<div class="big manual">${fmt(tot)} <span class="small muted" style="font-family:var(--body)">suggested</span></div><div class="bar"><i style="width:${100*run.i/e.plan.length}%"></i></div>`
      : `<div class="big" id="clock">${fmt(run.left)}</div><div class="bar"><i id="bar" style="width:${100*(tot-run.left)/tot}%"></i></div>`}

function viewFinished(){

    <button class="btn primary block" data-act="close">Back to today</button>
  </section>`;

function viewHistory(){
  const t=todayStr(); const cells=[]; const days=98;
  let last30=0, total=0, secs30=0, p30=0;
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=todayStr(d); const L=logFor(ds); const m=dayStats(L.days[ds]), pm=dayStats(L.posture[ds]); const did=m.did, pdid=pm.did; if(did&&i<30){last30+=did; secs30+=m.secs;} if(pdid&&i<30) p30+=pdid; cells.push(`<i class="${did?"t"+m.tier:""}${pdid?" p":""}${ds===t?" today":""}" title="${ds}${did?" · "+m.tier+" min"+(did>1?" ×"+did:""):""}${pdid?" · posture "+pm.tier+" min":""}"></i>`); }
  for(const y of Object.keys(logs)) for(const ds in logs[y].days) total+=dayStats(logs[y].days[ds]).did;
  const started=daysBetween(state.created,t);
  const ex=Object.entries(state.counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  let html=`<section class="card stack"><span class="eyebrow">Last 14 weeks</span><div class="heat">${cells.join("")}</div>
    <div class="grid2"><div class="stat"><b>${last30}</b><span>sessions, last 30 days</span></div><div class="stat"><b>${Math.round(secs30/60)}</b><span>minutes, last 30 days</span></div><div class="stat"><b>${total}</b><span>sessions since ${state.created}</span></div><div class="stat"><b>${started}</b><span>days since you started</span></div><div class="stat"><b>${p30}</b><span>posture sessions, last 30 days</span></div></div>
    <p class="small muted">Squares: morning routine by length. A dot marks a posture session.</p>
    <p class="note">A missed day changes nothing (Lally 2010). Consistency over months is the measure, not a streak.</p></section>`;
  if(ex.length) html+=`<section class="card stack"><span class="eyebrow">Most practised</span><div class="tablewrap"><table><thead><tr><th>Exercise</th><th>Times</th><th>Last</th></tr></thead><tbody>${ex.map(([id,n])=>`<tr><td>${esc(EXMAP[id]?EXMAP[id].name:id)}</td><td class="num">${n}</td><td class="num">${state.lastDone[id]||""}</td></tr>`).join("")}</tbody></table></div></section>`;
  // benchmarks
  if(state.sessions>=12){
    const rows=state.benchmarks.slice(-12).reverse();
    html+=`<section class="card stack"><span class="eyebrow">Benchmarks</span><h3>Monthly numbers</h3>
      <div class="grid2">${BENCH.map(b=>`<label class="field">${esc(b.name)} (${b.unit})<input type="number" inputmode="decimal" step="0.5" id="bench_${b.id}" placeholder="${esc(b.hint)}"></label>`).join("")}</div>
      <button class="btn primary" data-act="savebench">Save today's numbers</button>
      ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Date</th>${BENCH.map(b=>`<th>${esc(b.name.split(",")[0])}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td class="num">${r.date}</td>${BENCH.map(b=>`<td class="num">${r[b.id]??""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
    </section>`;
  } else html+=`<section class="card flat"><span class="eyebrow">Benchmarks</span><p class="small muted">Unlock after 12 sessions: one-leg stand with eyes closed, dead hang, sit–rise score and morning resting heart rate, once a month.</p></section>`;
  return html;
}

function viewLibrary(){
  const slots=["breath","spine","core","posture","shoulders","hips","legs","wrists","balance","floor","mind","video"];
  const locked=UNLOCK_ORDER.filter(id=>!state.unlocked.includes(id));
  let html=`<section class="card stack lib"><div class="row between"><div><span class="eyebrow">In rotation</span><h2>${state.unlocked.length} exercises</h2></div></div>`;
  for(const s of slots){

    html+=`<div class="eyebrow" style="margin-top:8px">${SLOT_NAMES[s]}</div>`;

}
function exDetails(ex){
  return `<details class="ex"><summary><span>${esc(ex.name)}</span><span class="row" style="gap:6px"><span class="small muted mono">${state.counts[ex.id]||0}×</span>${gradeChip(ex.grade)}</span></summary>

/* Structured guide: mini table of contents, then Why / Protects / How / Pitfalls / Evidence / Video. `ctx` keeps ids unique per place. */
const GUIDE_SECTIONS=[["why","Why"],["protects","Protects"],["how","How"],["pitfalls","Pitfalls"],["evidence","Evidence"],["video","Video"]];
function exGuide(ex,ctx,withHow){
  const k=s=>`g_${ctx}_${ex.id}_${s}`;
  const sections = (ctx==="runner"&&!withHow) ? GUIDE_SECTIONS.filter(([s])=>s!=="how") : GUIDE_SECTIONS;
  const note=profile.notes[ex.id]||"";
  const mine = ctx==="lib"
    ? `<label class="field">My note<textarea id="note_${ex.id}" class="prose short" placeholder="Anything specific to you for this one">${esc(note)}</textarea></label><div class="row"><button type="button" class="btn sm" data-savenote="${ex.id}">Save note</button></div>`
    : (note ? `<p class="note mynote">${esc(note)}</p>` : "");
  return `<div class="guide">${mine}
    <nav class="toc" aria-label="Sections">${sections.map(([s,l])=>`<button type="button" data-jump="${k(s)}">${l}</button>`).join("")}</nav>
    <section id="${k("why")}"><h4>Why it is here</h4><p>${esc(ex.why)}</p></section>
    <section id="${k("protects")}"><h4>What it protects</h4><ul>${ex.protects.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>
    ${(ctx==="runner"&&!withHow)?"":`<section id="${k("how")}"><h4>How to do it</h4><ol>${ex.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>`}
    <section id="${k("pitfalls")}"><h4>Pitfalls</h4><ul>${ex.pitfalls.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>
    <section id="${k("evidence")}"><h4>Evidence ${gradeChip(ex.grade)}</h4><p>${esc(ex.evidence)}</p></section>
    <section id="${k("video")}"><h4>Video</h4>${videoBlock(ex,ctx)}</section>
  </div>`;
}
function videoBlock(ex,ctx){
  if(ex.video){
    const url=`https://www.youtube.com/watch?v=${ex.video.id}`;
    const cap=`<p class="small muted">${esc(ex.video.title)}${ex.video.channel?` · ${esc(ex.video.channel)}`:""}</p>`;
    if(CAN_EMBED){
      const fid=`yt_${ctx}_${ex.id}`;
      return `<div class="player" id="${fid}" data-vid="${ex.video.id}"><button type="button" class="playbtn" data-play="${fid}" aria-label="Play video"><svg viewBox="0 0 24 24" width="56" height="56"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".9"/><path d="M10 8l6 4-6 4z" fill="var(--surface)"/></svg><span>Play here</span></button></div>${cap}<a class="small" href="${url}" target="_blank" rel="noopener">Open on YouTube instead</a>`;
    }
    return `<a class="btn" href="${url}" target="_blank" rel="noopener">▶ Watch on YouTube</a>${cap}<p class="small muted">Inline playback is blocked inside claude.ai; the self-hosted copy of this app plays it here.</p>`;
  }
  return `<a class="btn" href="${ex.search}" target="_blank" rel="noopener">Search YouTube</a><p class="small muted">No verified video for this one yet; the search opens matching tutorials.</p>`;
}
function playVideo(fid){

}

  <section class="card flat stack"><span class="eyebrow">About</span>
    <p class="small muted">Built from a review of the longevity and exercise research. Evidence chips mean: solid = trials or large consistent data for the stated reason; moderate = real but limited (older or clinical populations, association only); thin = plausible, practitioner-level, no trials. Nothing here treats a condition; pain that keeps coming back belongs with a clinician.</p></section>`;

function syncCard(){

  if(gistOn()) return `<section class="card stack"><span class="eyebrow">Sync between devices</span>
    <p class="small muted">Connected to a private GitHub gist. Everything is encrypted with your passphrase on this device before upload; GitHub only stores scrambled text. Changes upload a moment after you make them, and the app pulls the latest whenever it opens or comes back to the front.</p>
    <div class="row"><button class="btn sm" data-act="gistsync">Sync now</button><button class="btn sm" data-act="gistoff">Disconnect this device</button></div></section>`;
  return `<section class="card stack"><span class="eyebrow">Sync between devices</span>
    <p class="small muted">Optional. Your log and profile go into one private gist, encrypted on this device with your passphrase. Connect every device with the same token and passphrase.</p>

    <label class="field">Passphrase<input id="gistpass" type="password" autocomplete="new-password" spellcheck="false" placeholder="A sentence you will remember"></label>
    <div class="row"><button class="btn sm" data-act="giston">Connect</button><a class="btn sm" href="https://github.com/settings/tokens/new?scopes=gist&description=Morning%20Reserve" target="_blank" rel="noopener">Make a token</a></div>
    <p class="small muted">On the token page tick only <b>gist</b>; it then cannot read or change anything else on your account. If you forget the passphrase the synced copy cannot be opened, but each device keeps its own data.</p></section>`;
}

/* ===================== Events ===================== */
function bind(){
  const v=$("#view");
  v.onchange = ev => { if(ev.target.id==="pfile" && ev.target.files[0]) ev.target.files[0].text().then(loadProfileText); };
  v.onclick = ev => {
    const b=ev.target.closest("button,a,summary"); if(!b) return;
    if(b.tagName==="SUMMARY"){ setTimeout(FIG.start,30); const d=b.parentElement; if(d.classList.contains("more")&&run){ setTimeout(()=>{run.more=d.open;},0);} return; }
    if(b.dataset.jump){ jumpTo(b.dataset.jump); return; }
    if(b.dataset.play){ playVideo(b.dataset.play); return; }
    if(b.dataset.tier){ const t=+b.dataset.tier; const e=todayEntry(true); if(e.done.length){ toast("Press Again to plan another session"); return; } replan(t); render(); return; }
    if(b.dataset.swap!==undefined){ swapItem(+b.dataset.swap); return; }
    if(b.dataset.feel){ setFeel(b.dataset.feel,b.dataset.kind||"main"); return; }
    if(b.dataset.ptier){ const t=+b.dataset.ptier; const e=postureEntry(true); if(e.done.length){ toast("Press Again to plan another session"); return; } replanPosture(t); render(); return; }
    if(b.dataset.goto){ tab=b.dataset.goto; render(); return; }
    if(b.dataset.anchor){ const wk=isoWeek(); const L=logFor(todayStr()); const w=L.weeks[wk]||(L.weeks[wk]={}); w[b.dataset.anchor]=Math.max(0,(w[b.dataset.anchor]||0)+(+b.dataset.delta)); saveLog(todayStr()); render(); return; }
    if(b.dataset.savenote){ const id=b.dataset.savenote, t=$("#note_"+id).value.trim(); if(t) profile.notes[id]=t; else delete profile.notes[id]; saveProfile(); toast(t?"Note saved":"Note removed"); return; }
    if(b.dataset.themeset){ state.settings.theme=b.dataset.themeset; saveState(); render(); return; }
    if(b.dataset.pace){ state.settings.pace=b.dataset.pace; saveState(); render(); return; }
    if(b.dataset.switch){ const k=b.dataset.switch; const on=b.getAttribute("aria-checked")!=="true";
      if(k.startsWith("equip.")) state.settings.equip[k.slice(6)]=on; else state.settings[k]=on;
      if(k==="postureFocus" && on){ for(const id of POSTURE){ if(!state.unlocked.includes(id)) state.unlocked.push(id); } if(state.offered && POSTURE.includes(state.offered.id)) state.offered=null; toast("Posture set added to the rotation"); }
      saveState(); const e=todayEntry(true); if(!e.done.length && (k.startsWith("equip.")||k==="travel"||k==="postureFocus")) replan(e.tier); const pe=postureEntry(true); if(!pe.done.length && (k.startsWith("equip.")||k==="travel")) replanPosture(pe.tier); render(); return; }
    switch(b.dataset.act){
      case "start": startSession("main"); break;
      case "startmanual": startSession("main",true); break;
      case "again": newRound("main"); break;
      case "pstart": startSession("posture"); break;
      case "pstartmanual": startSession("posture",true); break;

      case "pagain": newRound("posture"); break;
      case "accept": acceptOffer(); break;
      case "snooze": snoozeOffer(); break;
      case "pause": run.paused=!run.paused; render(); break;
      case "done": advance(true); break;
      case "back": goBack(); break;
      case "skip": advance(false); break;
      case "cancel": { if(run.done.length){ const e=curEntry(); e.done=[...new Set([...e.done,...run.done])]; commitDay(e,todayStr(),run.kind); } cancelSession(); break; }
      case "close": run=null; render(); break;
      case "peek": state.peek=!state.peek; saveState(); render(); break;
      case "savebench": { const r={date:todayStr()}; let any=false; for(const bb of BENCH){ const val=$("#bench_"+bb.id).value; if(val!==""){ r[bb.id]=+val; any=true; } } if(!any){ toast("Enter at least one number"); return; } state.benchmarks.push(r); saveState(); toast("Saved"); render(); break; }
      case "export": { const data=JSON.stringify({state,logs,profile}); const ta=$("#iotext"); $("#io").classList.remove("hidden"); ta.value=data; navigator.clipboard&&navigator.clipboard.writeText(data).then(()=>toast("Copied"),()=>{ ta.focus(); ta.select(); toast("Select and copy the text"); }); break; }
      case "reload": location.reload(); break;
      case "pdownload": { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(profile,null,2)+"\n"],{type:"application/json"})); a.download="profile.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); break; }
      case "pedit": { $("#pio").classList.toggle("hidden"); $("#ptext").value=JSON.stringify(profile,null,2); break; }
      case "psave": loadProfileText($("#ptext").value); break;
      case "pclear": { if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Tap again to remove"; return; } profile=defaultProfile(); saveProfile(); toast("Profile removed from this device"); render(); break; }
      case "savepnote": profile.postureNote=$("#pnote").value.trim(); saveProfile(); toast("Saved"); render(); break;
      case "giston": { const t=$("#gisttoken").value.trim(), pw=$("#gistpass").value; if(!t){ toast("Paste a token first"); return; } if(pw.length<8){ toast("Use a passphrase of at least 8 characters"); return; } toast("Connecting…"); gistConnect(t,pw); break; }
      case "gistsync": gistSync(false).then(()=>toast(online?"Synced":"Could not sync; saved on this device")); break;
      case "gistoff": clearTimeout(gist.timer); gist.timer=null; gist.cfg=null; LS.set("gist",null); setSync(false); toast("Disconnected; your data stays on this device"); render(); break;
      case "showimport": $("#io").classList.toggle("hidden"); $("#iotext").value=""; break;
      case "import": { try{ const o=JSON.parse($("#iotext").value); if(!o.state||!o.logs) throw 0; state=mergeState(o.state); logs=o.logs; if(o.profile){ try{ profile=cleanProfile(o.profile); LS.set("profile",profile); applyProfile(); }catch(e){} } saveState(); for(const y of Object.keys(logs)) persist("log-"+y,logs[y]); gistReplace(); toast("Imported"); render(); }catch(e){ toast("That is not an export from this app"); } break; }
    }
  };
}
